[package]
  name = "silk"
  version = "0.1.0"
  edition = "2024"
  description = "A minimal, GNOME-native Markdown editor"
  license = "MIT"

[[bin]]
  name = "silk-markdown-editor"
  path = "src/main.rs"

[build-dependencies]
  glib-build-tools = "0.22"

[dependencies]
  relm4 = { version = "0.11", features = ["libadwaita", "macros", "gnome_46"] }
  pulldown-cmark = "0.13"
  webkit6 = "0.6"
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  toml = "1.2"

[dev-dependencies]
  tempfile = "3"

[profile.release]
  lto = true
  strip = true
  codegen-units = 1

[lints.clippy]
  all = "warn"
  pedantic = "warn"
  cognitive_complexity = "warn"
  panic = "warn"
  empty_line_after_doc_comments = "warn"
  undocumented_unsafe_blocks = "warn"
  unnecessary_safety_comment = "warn"
  doc_markdown = "warn"
[package]
  name = "silk"
  version = "0.1.0"
  edition = "2024"
  # relm4 0.11 requires Rust 1.93+
  rust-version = "1.85"
  description = "A minimal, GNOME-native Markdown editor"
  license = "GPL-3.0-or-later"

[[bin]]
  name = "silk-markdown-editor"
  path = "src/main.rs"

[dependencies]
  relm4 = { version = "0.11", features = ["libadwaita", "macros", "gnome_46"] }
  pulldown-cmark = "0.12"
  webkit6 = "0.6"
  serde = { version = "1", features = ["derive"] }
  serde_json = "1"
  toml = "0.8"

[profile.release]
  lto = true
  strip = true
  codegen-units = 1

[lints.clippy]
  all = "warn"
  pedantic = "warn"
  cognitive_complexity = "warn"
  panic = "warn"
  empty_line_after_doc_comments = "warn"
  undocumented_unsafe_blocks = "warn"
  unnecessary_safety_comment = "warn"
  doc_markdown = "warn"